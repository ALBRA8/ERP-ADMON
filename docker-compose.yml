# ============================================================
# docker-compose.yml — Marsella ERP
# ============================================================
# Levanta el ERP Marsella (Next.js 16 + Prisma/SQLite) en
# producción. El archivo SQLite se persiste en un volumen
# local (`./data`) para no perder datos entre reinicios.
# ============================================================

version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marsella-erp
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/marsella.db
      - HOSTNAME=0.0.0.0
      - PORT=3000
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget -qO- http://localhost:3000/api/auth/demo >/dev/null 2>&1 || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
